# get.map on a Mac mini (Apple silicon, internal SSD). Included from
# postgresql.conf by setup.sh. Sized for 16 GB of memory: for 24 / 32 GB raise
# shared_buffers to 6GB / 8GB and effective_cache_size to 14GB / 20GB.

listen_addresses = 'localhost'          # only get.map, on this Mac, talks to Postgres
max_connections = 40

shared_buffers = 4GB
effective_cache_size = 10GB
work_mem = 32MB
maintenance_work_mem = 512MB

# Compression: TOAST values (raw answers, feature lists) and WAL with lz4
default_toast_compression = lz4
wal_compression = lz4

# Captured data, not money: a crash may lose the last ~0.5 s of captures (never
# corrupts anything) in exchange for far fewer SSD flushes.
synchronous_commit = off
wal_writer_delay = 500ms

# Fewer, larger checkpoints: less write amplification on the SSD
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# SSD
random_page_cost = 1.1
effective_io_concurrency = 0            # macOS has no posix_fadvise

# Keep the busy, constantly-updated tables (places, shapes, alerts) tidy
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.05

log_min_duration_statement = 2000       # log queries slower than 2 s
log_checkpoints = on
